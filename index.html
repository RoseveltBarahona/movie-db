<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="css/mains.css">
	<title>Movie DB - Sitio de peliculas</title>
	<script type="module">
		document.getElementById("current-date").innerHTML = new Date().toLocaleDateString();
	</script>
	<script defer type="module" src="app.js"></script>
</head>

<body id="body">
	<header class="header">
		<div class="wrap header-content">
			<a class="skip-link" href="#main">Ir al contenido principal</a>
		
			<a id="logo" href="index.html" aria-label="Ir a la página de inicio">
				<img width="128" height="27" src="img/logo.svg" alt="" class="logo">
			</a>
			<nav>
				<button class="topnav__open" id="btn-open" aria-expanded="false" aria-label="Abrir menú de navegación">
					<img src="img/hamburger-black.svg" alt="" width="40" height="24" />
				</button>

				<div class="topnav" id="navigation" role="dialog" aria-label="Menú de navegación abierto">
					<button class="topnav__close" id="btn-close" aria-label="Cerrar menú de navegación">
						<img src="img/close-black.svg" alt="" width="28" height="27" />
					</button>
					<ul class="topnav__links">
						<li class="topnav_link"><a class="topnav__item topnav__item--active" href="index.html">Mejor valoradas</a></li>
						<li class="topnav_link"><a class="topnav__item" href="now_playing.html">En cartelera</a></li>
						<li class="topnav_link"><a class="topnav__item" href="#">Contacto</a></li>
					</ul>
				</div>
			</nav>
		</div>
	</header>
	<section class="hero">
		<div class="wrap hero__content">
			<img class="hero__bg" src="img/vector-bg.svg" alt="">
			<h1 class="hero__title"><span>Top peliculas</span> Mejor Valoradas</h1>
			<div class="hero__images">
				<img class="hero__image" src="img/top-movies/image-01.jpg" alt="">
				<img class="hero__image" src="img/top-movies/image-02.jpg" alt="">
				<img class="hero__image" src="img/top-movies/image-03.jpg" alt="">
			</div>
		</div>
	</section>
	<main id="main">
		<section class="page">
			<div>
				<h2 class="page__info">Página <span id="current-page">1</span></h2>
				<div class="date">Actualizado: <span id="current-date"></span></div>
			</div>
		</section>
		<ul class="wrap container-movies" id="container-movies" aria-live="polite" aria-atomic="true"></ul>
	</main>
	<footer class="footer" id="footer" hidden>
		<div class="wrap pagination" id="pagination">
			<button class="btn btn-secondary" id="btn-prev">Anterior</button>
			<div class="footer__info" aria-describedby="footer-page-info">
				<span id="footer-page-info" class="u-sr-only">Página 1</span>
				<span id="footer-page-info-number" aria-hidden="true">1</span>
			</div>
			<button class="btn btn-primary" id="btn-next">Siguiente</button>
		</div>
	</footer>
</body>

</html>
